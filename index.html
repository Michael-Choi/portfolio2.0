    <script>
      // Set the theme before the page draws, so it never flashes the wrong colors.
      // Keep the key and colors in sync with src/useTheme.ts.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').content = '#0e0e10';
      })();
    </script>
